# =============================================================================
# Egress policy gate for the `claude` container.
#
# Pure allowlist. No caching, no TLS interception: HTTPS is allowed per-domain
# at the CONNECT stage (the proxy sees the destination host but never decrypts
# the tunnel), so traffic stays end-to-end encrypted and no custom CA is needed.
#
# Add your own destinations in allowed-domains.txt (and allowed-ssh-hosts.txt)
# rather than editing this file, so the policy stays reviewable.
# =============================================================================

http_port 3128

# Log allows/denies to the container's stdout so `docker logs egress-proxy`
# shows exactly what was permitted or blocked (how you discover a domain you
# need to add). If your squid build can't write /dev/stdout, delete the two
# lines below and use: docker exec egress-proxy tail -f /var/log/squid/access.log
access_log stdio:/dev/stdout
cache_log /dev/stderr
cache deny all

# --- method / port classes ---
acl CONNECT   method CONNECT
acl SSL_port  port 443
acl HTTP_port port 80
acl SSH_port  port 22

# --- allowlisted destinations (a leading dot = that domain and all subdomains) ---
# AI provider APIs. Keep .anthropic.com generous: losing it breaks Claude Code
# (the agent itself) — it must reach api.anthropic.com to function.
acl dst_ai      dstdomain .anthropic.com .openai.com .chatgpt.com .oaistatic.com .googleapis.com .googleusercontent.com
# GitHub: git-over-HTTPS, API, and release/raw downloads.
acl dst_github  dstdomain .github.com .githubusercontent.com codeload.github.com
# Common package registries (npm / pip / composer+packagist / go / debian+sury).
acl dst_pkgs    dstdomain .npmjs.org registry.npmjs.org pypi.org files.pythonhosted.org .packagist.org repo.packagist.org proxy.golang.org sum.golang.org .golang.org storage.googleapis.com deb.debian.org security.debian.org packages.sury.org
# Your own additions — one domain per line (see allowed-domains.txt).
acl dst_extra   dstdomain "/etc/squid/allowed-domains.txt"
# Optional outbound-SSH destinations — one host per line (see allowed-ssh-hosts.txt).
acl ssh_hosts   dstdomain "/etc/squid/allowed-ssh-hosts.txt"

acl allowed_https any-of dst_ai dst_github dst_pkgs dst_extra

# --- policy (first match wins; default is deny) ---
# HTTPS: CONNECT to :443 only, and only to allowlisted domains.
http_access allow CONNECT SSL_port allowed_https
# Plain HTTP :80 to allowlisted domains (apt, registry redirects).
http_access allow HTTP_port allowed_https
# Optional: outbound SSH to your own hosts, tunnelled as CONNECT :22.
http_access allow CONNECT SSH_port ssh_hosts
# Everything else is denied (and logged above).
http_access deny all
