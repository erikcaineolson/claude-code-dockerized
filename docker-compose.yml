services:
  claude:
    build:
      context: .
    container_name: claude-code
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    environment:
      # Point the docker CLI at the rootless DinD sidecar below (an isolated
      # daemon), never the host. Only resolves when the `dind` profile is up:
      #   docker compose --profile dind up -d
      # With the profile down, `docker ...` here just fails to connect — there
      # is no host daemon access by design.
      DOCKER_HOST: tcp://dind:2375
    env_file:
      - path: .env
        required: false
    volumes:
      # Mount your project workspace
      - ./workspace:/workspace
      - ./../../Projects:/projects
      # Extra host directories go in the gitignored docker-compose.override.yml
      # (Compose auto-merges it — see docker-compose.override.yml.example), so
      # machine-specific paths never land in this committed file.
      # Optional host SSH config/keys (gitignored ./ssh — see ssh/README.md).
      # Read-only; entrypoint.sh copies the contents into ~/.ssh with correct
      # permissions at boot.
      - ./ssh:/home/node/host-ssh:ro
      # NOTE: the host Docker socket is intentionally NOT mounted. Mounting
      # /var/run/docker.sock would give this container (and any agent running
      # in it) control of the host Docker daemon — i.e. a trivial escape to
      # host root, which defeats no-new-privileges and the non-root user. If
      # you need testcontainers / in-container image builds, expose the daemon
      # through a locked-down socket proxy instead of a raw bind-mount.
      # Persist Claude Code config between runs
      # WARNING: This volume stores settings.json which may contain API keys.
      # Use `docker volume rm claude-code-dockerized_claude-config` to purge.
      - claude-config:/home/node/.claude
      # Codex ChatGPT login in its own volume, nested over claude-config at the
      # CODEX_HOME path, so the `codex login` persists across rebuilds
      # independently of claude-config.
      - codex-auth:/home/node/.claude/codex
    working_dir: /projects

  # ---------------------------------------------------------------------------
  # Rootless Docker-in-Docker — an ISOLATED daemon for spinning up throwaway
  # test containers (testcontainers, image builds) WITHOUT exposing the host
  # Docker daemon. The `claude` service talks to it over TCP (DOCKER_HOST above).
  # Containers created here live inside this sidecar's own nested daemon and
  # cannot see the host filesystem, the host's other containers, or your
  # secrets — that isolation is the whole point of not bind-mounting
  # /var/run/docker.sock.
  #
  # `privileged: true` is required for the user-namespace / overlay setup, but
  # dockerd and every container it launches run ROOTLESS (unprivileged, uid-
  # remapped). The `claude` container only has TCP API access to this daemon —
  # no shell in here — so an agent cannot leverage this container's privilege or
  # reach real host root. A nested `-v /:/host` mounts THIS sidecar's fs, not
  # the host's.
  #
  # Profile-gated so it's off by default (privileged + overhead). Start it with:
  #   docker compose --profile dind up -d
  # TCP 2375 is non-TLS but never published to the host — only reachable by
  # sibling containers on this compose network. dind-data caches pulled images
  # across restarts. Pin a version (e.g. docker:29-dind-rootless) if you want to
  # match the engine you build against.
  # ---------------------------------------------------------------------------
  dind:
    profiles: ["dind"]
    image: docker:dind-rootless
    container_name: dind-rootless
    privileged: true
    environment:
      # Empty cert dir => daemon listens on tcp://0.0.0.0:2375 without TLS.
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind-data:/home/rootless/.local/share/docker

  # ---------------------------------------------------------------------------
  # Laravel dev services. Sibling containers on this compose project's default
  # network — an app run inside the claude container reaches them by service
  # name:
  #   DB_HOST=dev-mariadb  DB_PORT=3306  REDIS_HOST=dev-redis  REDIS_PORT=6379
  # Ports are intentionally not published to the host.
  # Profile-gated so idle runs don't burn overhead — start on demand with:
  #   docker compose --profile db up -d
  # (start the profile before running test suites that need these services.)
  # ---------------------------------------------------------------------------
  dev-mariadb:
    profiles: ["db"]
    image: mariadb:10.11
    container_name: dev-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-app}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-secret}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot sidecar: creates the empty `testing` database Laravel test suites
  # expect (phpunit.xml sets DB_DATABASE=testing) and grants the app user on
  # it. Idempotent — runs once mariadb is healthy, then exits.
  dev-mariadb-init:
    profiles: ["db"]
    image: mariadb:10.11
    depends_on:
      dev-mariadb:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_USER: ${MARIADB_USER:-app}
    entrypoint:
      - sh
      - -c
      - >
        mariadb -h dev-mariadb -uroot -p"$$MARIADB_ROOT_PASSWORD" -e
        "CREATE DATABASE IF NOT EXISTS testing;
        GRANT ALL PRIVILEGES ON testing.* TO '$$MARIADB_USER'@'%';
        FLUSH PRIVILEGES;"
    restart: "no"

  dev-redis:
    profiles: ["db"]
    image: redis:alpine
    container_name: dev-redis

volumes:
  claude-config:
  mariadb-data:
  # Image/layer cache for the rootless DinD sidecar, so `--profile dind` runs
  # don't re-pull test images on every restart.
  dind-data:
  # Created once outside compose (`docker volume create codex-auth`); external
  # so `compose down -v` can't wipe the persisted `codex login`.
  codex-auth:
    external: true
    name: codex-auth
